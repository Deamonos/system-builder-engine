<?xml version="1.0" encoding="UTF-8"?>
<!-- SBE : icône par défaut des OBJETS — un cube en perspective
     (l'objet concret issu du modèle), blanc plein sur fond
     transparent, même famille que l'icône des modèles. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g stroke="#ffffff" stroke-width="34" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Silhouette du cube (hexagone) -->
    <path d="M256 62 L424 159 L424 353 L256 450 L88 353 L88 159 Z"/>
    <!-- Arêtes visibles -->
    <path d="M256 256 L256 450"/>
    <path d="M256 256 L88 159"/>
    <path d="M256 256 L424 159"/>
  </g>
</svg>
